# Builds the Windows and Mac installers and publishes them as a GitHub Release.
# Runs when a version tag is pushed, e.g. `git tag v1.2.0 && git push --tags`, or from the Actions
# tab ("Run workflow" on main), which releases the version in package.json and makes its tag.
# The installed apps check these releases for updates.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # The release's tag: the pushed tag, or v<package.json version> when started by hand.
  TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}

permissions:
  contents: write

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag
        id: tag
        run: echo "tag=${TAG:-v$(node -p 'require("./package.json").version')}" >> "$GITHUB_OUTPUT"
      - name: Create the release (hidden until the builds finish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        # If a draft is left over from a failed run, point it at this commit so the tag lands on the
        # code that was actually built.
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Orbit ${TAG#v}" --generate-notes

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: Mac
            os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - name: Build and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid certificates: don't look for signing identities.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish always

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Make the release public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
