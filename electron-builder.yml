appId: com.notesapp.desktop
productName: Orbit
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  # The tray / menu bar icons are loaded at run time.
  - build/icon.png
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  # The Terminal tab's command line (node-pty): only the ready-made parts, without debug files.
  - '!node_modules/node-pty/{src,deps,third_party,scripts,build,typings,node-addon-api}/**'
  - '!node_modules/node-pty/binding.gyp'
  - '!node_modules/node-pty/**/*.pdb'
  - '!node_modules/node-addon-api/**'
  # The offline handwriting reader uses the smaller English model (4.0.0_best_int), not this one.
  - '!node_modules/@tesseract.js-data/eng/4.0.0/**'
# node-pty is used as it comes (it's ready-made for Windows and both kinds of Mac), so it isn't rebuilt.
npmRebuild: false
# These can't run from inside the app's archive: node-pty's programs and background helper, and
# the offline handwriting reader's worker thread and the packages it loads.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/**
  - node_modules/regenerator-runtime/**
  - node_modules/is-url/**
  - node_modules/wasm-feature-detect/**
  - node_modules/bmp-js/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  files:
    - '!node_modules/node-pty/prebuilds/{darwin-*,win32-arm64}/**'
nsis:
  oneClick: false
  # An unticked box to also download ffmpeg (for the Studio's Go live).
  include: build/installer.nsh
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Orbit
  artifactName: Orbit-Setup-${version}.${ext}
  # Keep your settings if you uninstall and reinstall. Your notes are never touched either way.
  deleteAppDataOnUninstall: false
mac:
  # dmg to install from; zip is what update checks read.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.productivity
  files:
    - '!node_modules/node-pty/prebuilds/win32-*/**'
  # No paid Apple certificate: build/adhoc-sign.cjs signs the app "ad hoc" instead, which Apple
  # Silicon Macs require before they'll run it at all.
  identity: null
  hardenedRuntime: false
  # Asked the first time you record a voice note.
  extendInfo:
    NSMicrophoneUsageDescription: Orbit uses the microphone to record voice notes.
    # Asked when you import from Apple Notes (Orbit reads them from the Notes app), and when the
    # music player first controls the Spotify app.
    NSAppleEventsUsageDescription: Orbit reads your Apple Notes to import them, and controls Spotify for the music player.
    # Asked when mouse sharing first looks for (and connects to) your other computer on the Wi-Fi.
    NSLocalNetworkUsageDescription: Orbit finds and connects to your other computer on this network to share one mouse and keyboard, and to reach your phone.
  notarize: false
  # Used by the zip; the dmg (the one to download) gets the simpler name below.
  artifactName: Orbit-${version}-${arch}-mac.${ext}
dmg:
  artifactName: Orbit-${version}-${arch}.${ext}
afterPack: build/adhoc-sign.cjs
# Installers and update files go to this repository's GitHub Releases.
publish:
  provider: github
  owner: Looby758
  repo: notes-app
  releaseType: draft
