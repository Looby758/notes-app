appId: com.notesapp.desktop
productName: Notes
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  # The tray / menu bar icons are loaded at run time.
  - build/icon.png
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  # The Terminal tab's command line (node-pty): only the ready-made parts, without debug files.
  - '!node_modules/node-pty/{src,deps,third_party,scripts,build,typings,node-addon-api}/**'
  - '!node_modules/node-pty/binding.gyp'
  - '!node_modules/node-pty/**/*.pdb'
  - '!node_modules/node-addon-api/**'
# Used as it comes (it's ready-made for Windows and both kinds of Mac), so it isn't rebuilt.
npmRebuild: false
# Its programs and background helper can't run from inside the app's archive.
asarUnpack:
  - node_modules/node-pty/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  files:
    - '!node_modules/node-pty/prebuilds/{darwin-*,win32-arm64}/**'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Notes
  artifactName: Notes-Setup-${version}.${ext}
  # Keep your settings if you uninstall and reinstall. Your notes are never touched either way.
  deleteAppDataOnUninstall: false
mac:
  # dmg to install from; zip is what update checks read.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.productivity
  files:
    - '!node_modules/node-pty/prebuilds/win32-*/**'
  # No paid Apple certificate: build/adhoc-sign.cjs signs the app "ad hoc" instead, which Apple
  # Silicon Macs require before they'll run it at all.
  identity: null
  hardenedRuntime: false
  # Asked the first time you record a voice note.
  extendInfo:
    NSMicrophoneUsageDescription: Notes uses the microphone to record voice notes.
    # Asked when you import from Apple Notes (Notes reads them from the Notes app).
    NSAppleEventsUsageDescription: Notes reads your Apple Notes so it can import them.
  notarize: false
  # Used by the zip; the dmg (the one to download) gets the simpler name below.
  artifactName: Notes-${version}-${arch}-mac.${ext}
dmg:
  artifactName: Notes-${version}-${arch}.${ext}
afterPack: build/adhoc-sign.cjs
# Installers and update files go to this repository's GitHub Releases.
publish:
  provider: github
  owner: Looby758
  repo: notes-app
  releaseType: draft
